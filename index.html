<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laba Batik Bu Sri: Lab 3D Fungsi Kuadrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDE3; --surface:#FFFCF6; --surface2:#F7F1E6; --ink:#1D2333; --muted:#5B6274; --line:#DCD1BD;
  --soga:#8E5420; --gold:#B9842F; --nila:#1E2B4D; --tarum:#2B7A69; --mengkudu:#AE3F2C; --focus:#2F6FE0;
  --ok-bg:#E3F2EC; --bad-bg:#F8E6E1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121624; --surface:#1A2032; --surface2:#20273C; --ink:#EEE8DC; --muted:#A5AABA; --line:#2E3652;
    --soga:#D99A58; --gold:#E2B260; --tarum:#5DBBA5; --mengkudu:#E7826A; --focus:#7BA6FF;
    --ok-bg:#183A31; --bad-bg:#432622; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121624; --surface:#1A2032; --surface2:#20273C; --ink:#EEE8DC; --muted:#A5AABA; --line:#2E3652;
  --soga:#D99A58; --gold:#E2B260; --tarum:#5DBBA5; --mengkudu:#E7826A; --focus:#7BA6FF;
  --ok-bg:#183A31; --bad-bg:#432622; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,var(--surface) 0 18%,transparent 19%),
  conic-gradient(from 45deg,var(--soga) 0 25%,var(--gold) 0 50%,var(--soga) 0 75%,var(--gold) 0)}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.hdr-actions{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--soga)}
.btn.primary{background:var(--nila);border-color:var(--nila);color:#F6EFE2}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1406}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1406}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);min-height:0}
.stage{position:relative;overflow:hidden;min-height:0;touch-action:none;
  background:radial-gradient(120% 90% at 50% 0%,#2C3B66 0%,#1A2340 55%,#10162A 100%)}
.stage.ar{background:#000}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.stage.ar video{display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;color:#F6EFE2;
  background:rgba(16,22,42,.72);padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.14)}
.lbl.tick{background:none;border:none;color:rgba(246,239,226,.75);font-weight:600;font-size:11px;padding:0}
.lbl.gold{color:#F3CF85}.lbl.green{color:#8FE0C8}.lbl.red{color:#FFB4A1}
.hud{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{font-size:12px;font-weight:600;color:#F6EFE2;background:rgba(16,22,42,.7);border:1px solid rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.hint3d{position:absolute;right:12px;top:12px;font-size:12px;color:rgba(246,239,226,.8);background:rgba(16,22,42,.6);padding:5px 10px;border-radius:8px;pointer-events:none}
aside{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.steps{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.step{flex:1 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:var(--surface2);
  padding:6px 9px;border-radius:9px;cursor:pointer;min-width:56px;text-align:left}
.step b{font-size:13px}.step span{font-size:11px;color:var(--muted)}
.step[aria-current="step"]{border-color:var(--soga);box-shadow:inset 0 -3px 0 var(--soga)}
.step.done b::after{content:" ✓";color:var(--tarum)}
.content{padding:18px 20px 28px;overflow-y:auto;min-height:0}
.content h2{font-size:21px;line-height:1.25;margin:0 0 4px;letter-spacing:-.015em}
.meta{color:var(--muted);font-size:13px;margin:0 0 14px}
.content p{margin:0 0 12px;max-width:62ch}
.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--gold);
  padding:8px 12px;border-radius:8px;margin:0 0 12px;overflow-x:auto;white-space:nowrap}
.task{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;background:var(--surface2)}
.task h3{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--soga);background:var(--bg)}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}.fb.info{background:var(--surface);border:1px solid var(--line)}
label.tog{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.slider{margin:10px 0}
.slider .top{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
input[type=range]{width:100%;accent-color:var(--soga)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.form input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.badge.ai{border-color:var(--tarum);color:var(--tarum)}
.story{border-left:3px solid var(--soga);padding-left:12px;margin:10px 0 12px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nila);color:#F6EFE2;padding:10px 16px;border-radius:10px;
  max-width:min(92vw,480px);font-size:14px;z-index:20;display:none}
.toast.show{display:block}
ul.clean{padding-left:18px;margin:0 0 12px}
ul.clean li{margin-bottom:4px}
@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:48vh auto;overflow-y:auto}
  .app{grid-template-rows:auto minmax(0,1fr)}
  aside{border-left:none;border-top:1px solid var(--line)}
  .content{overflow:visible}
  .brand small{display:none}
}
@media (max-width:420px){ .form,.stats{grid-template-columns:1fr} .hdr-actions .btn{padding:7px 10px;font-size:13px} }
.lbl.info{pointer-events:auto;cursor:pointer;border-color:rgba(159,232,255,.7);font:inherit;font-size:12px;font-weight:700}
.lbl.info:hover{background:rgba(30,43,77,.95)}
.infocard{position:absolute;left:12px;top:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 70px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid #6FC8E8;border-radius:12px;padding:12px 14px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.infocard h3{margin:0 26px 6px 0;font-size:15px}.infocard p{margin:0 0 8px;font-size:13.5px}.infocard .ifx{font-family:"Cambria Math","Times New Roman",serif;color:var(--muted)}
.infocard .ix{position:absolute;right:8px;top:8px;border:none;background:none;cursor:pointer;font-size:15px;color:var(--muted)}
.infocard[hidden]{display:none}
details.concept{border:1px solid var(--line);border-left:4px solid #6FC8E8;border-radius:10px;padding:8px 12px;margin:0 0 12px;background:var(--surface2)}
details.concept summary{cursor:pointer;font-weight:700;font-size:14px}
details.concept p{margin:8px 0 0;font-size:14px}
.bepsteps{font-family:"Cambria Math","Times New Roman",serif;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.6;overflow-x:auto}
.infocard .bepsteps{font-size:13px}
dialog#dosen{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(740px,94vw);max-height:90vh}
dialog#dosen::backdrop{background:rgba(8,12,24,.55)}
.dwrap{padding:18px 20px;overflow-y:auto;max-height:calc(90vh - 70px)}
.dwrap h2{margin:0 0 4px;font-size:20px}
.dwrap fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:12px 0}
.dwrap legend{font-weight:700;font-size:14px;padding:0 6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dgrid label,.dfull{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.dgrid input,.dfull input,.dfull textarea{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 9px;width:100%;font-weight:500}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.hdr-actions .btn[hidden]{display:none}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true"></div>
      <div><h1 id="brandName">Laba Batik Bu Sri</h1><small>Lab 3D fungsi kuadrat untuk Matematika Bisnis</small></div></div>
    <div class="hdr-actions">
      <button class="btn" id="btnDosen" type="button" hidden>⚙️ Mode Dosen</button>
      <button class="btn" id="btnNarr" type="button">🔊 Narasi</button>
      <button class="btn" id="btnAR" type="button">📷 Mode AR</button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <video id="cam" playsinline muted></video>
      <div id="labels"></div>
      <div class="hud" id="hud"></div>
      <div class="hint3d" id="hint3d">Geser untuk memutar · sentuh ⓘ untuk penjelasan titik</div>
      <div class="infocard" id="infoCard" hidden role="dialog" aria-live="polite"><button type="button" class="ix" id="infoClose" aria-label="Tutup penjelasan">✕</button><h3></h3><div class="ib"></div></div>
    </div>
    <aside>
      <nav class="steps" id="steps" aria-label="Tahapan belajar"></nav>
      <div class="content" id="content" tabindex="-1"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dosen" aria-labelledby="dTitle"><form method="dialog">
<div class="dwrap"><h2 id="dTitle">Mode Dosen: ubah soal</h2><p class="meta" id="dMode"></p>
<fieldset><legend>Identitas dan cerita</legend><div class="dgrid">
<label>Judul aplikasi<input name="judul" maxlength="60"></label><label>Nama tokoh<input name="nama" maxlength="40"></label>
<label>Profil tokoh<input name="profil" maxlength="120" placeholder="perajin batik cap di Pekalongan"></label><label>Nama produk<input name="produk" maxlength="40" placeholder="kain batik"></label>
<label>Satuan produk<input name="satuan" maxlength="20" placeholder="lembar"></label></div></fieldset>
<fieldset><legend>Data usaha (dalam ribu rupiah)</legend><div class="dgrid">
<label>Harga maksimum (a pada p = a − bq)<input name="a0" inputmode="decimal"></label><label>Penurunan harga per unit (b pada p = a − bq)<input name="b0" inputmode="decimal"></label>
<label>Biaya tetap per bulan<input name="F" inputmode="decimal"></label><label>Biaya variabel per unit<input name="v" inputmode="decimal"></label></div></fieldset>
<fieldset><legend>Skenario Lab koefisien (Tahap 5)</legend>
<label class="dfull">Perubahan yang dialami tokoh<input name="labDesc" maxlength="120" placeholder="berhenti menyewa kios dan beralih berjualan di marketplace"></label>
<div class="dgrid" style="margin-top:10px"><label>Perubahan biaya tetap (negatif = turun)<input name="dF" inputmode="decimal"></label><label>Perubahan biaya per unit (negatif = turun)<input name="dv" inputmode="decimal"></label></div></fieldset>
<fieldset><legend>Latihan GenAI (Tahap 6)</legend><label class="dfull">Arahan untuk GenAI (opsional)<textarea name="aiKonteks" maxlength="300" placeholder="contoh: produk kuliner khas Sumatra, jumlah produksi di bawah 100 unit"></textarea></label></fieldset>
<div class="fb" id="dPrev"></div></div>
<div class="dfoot"><button class="btn" id="dReset" type="button">Kembalikan soal bawaan</button><span style="display:flex;gap:8px"><button class="btn" id="dCancel" type="button">Batal</button><button class="btn primary" id="dSave" type="submit">Simpan soal</button></span></div>
</form></dialog>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* ========== Format ========== */
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const f2=x=>(Math.round(x*100)/100).toLocaleString('id-ID',{maximumFractionDigits:2});
const rp=v=>(v<0?'−':'')+'Rp'+fmt(Math.abs(v)*1000);
const shortRp=v=>{const a=Math.abs(v),s=v<0?'−':'';return a>=1000?s+'Rp'+(a/1000).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':s+'Rp'+fmt(a)+' rb'};
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const num=v=>parseFloat(String(v??'').replace(/rp/i,'').replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));for(const k of [1,2,2.5,5,10])if(k*p>=x-1e-9)return k*p;return 10*p}
function ticks(a,b){const s=niceStep((b-a)/6),out=[];for(let t=Math.ceil(a/s)*s;t<=b+1e-9;t+=s)out.push(Math.round(t*100)/100);return out}
const pickStep=(vals,cands)=>cands.find(s=>vals.every(v=>Math.abs(v/s-Math.round(v/s))<1e-9))||cands[cands.length-1];

/* ========== Konfigurasi (Mode Dosen) ========== */
const DEFAULT={judul:'Laba Batik Bu Sri',nama:'Bu Sri',profil:'perajin batik cap di Pekalongan',produk:'kain batik',satuan:'lembar',
  a0:300,b0:2,F:5400,v:60,labDesc:'berhenti menyewa kios di pasar dan beralih berjualan di marketplace',dF:-2200,dv:40,aiKonteks:''};
let C={...DEFAULT};
function model(c){const B=c.a0-c.v,disc=B*B-4*c.b0*c.F,sq=Math.sqrt(Math.max(disc,0));
  const F2=c.F+c.dF,v2=c.v+c.dv,B2=c.a0-v2,disc2=B2*B2-4*c.b0*F2,sq2=Math.sqrt(Math.max(disc2,0));
  return{B,disc,q1:(B-sq)/(2*c.b0),q2:(B+sq)/(2*c.b0),qs:B/(2*c.b0),pmax:disc/(4*c.b0),qR:c.a0/(2*c.b0),Rmax:c.a0*c.a0/(4*c.b0),q0:c.a0/c.b0,
    F2,v2,B2,disc2,t1:(B2-sq2)/(2*c.b0),t2:(B2+sq2)/(2*c.b0),ts:B2/(2*c.b0),tmax:disc2/(4*c.b0)}}
function validate(c){const e=[],w=[];const ok=x=>typeof x==='number'&&isFinite(x);
  ['judul','nama','profil','produk','satuan'].forEach(k=>{if(!c[k]||!String(c[k]).trim())e.push('Kolom '+k+' wajib diisi.')});
  if(!ok(c.a0)||c.a0<=0)e.push('Harga maksimum harus lebih dari 0.');
  if(!ok(c.b0)||c.b0<=0)e.push('Penurunan harga per unit harus lebih dari 0.');
  if(!ok(c.F)||c.F<=0)e.push('Biaya tetap harus lebih dari 0.');
  if(!ok(c.v)||c.v<0)e.push('Biaya variabel per unit tidak boleh negatif.');
  if(!ok(c.dF)||!ok(c.dv))e.push('Perubahan biaya pada Lab koefisien harus berupa angka (boleh negatif).');
  if(e.length)return{e,w};
  const m=model(c);
  if(c.a0<=c.v)e.push('Harga maksimum harus lebih besar daripada biaya variabel per unit.');
  else if(m.disc<=0)e.push('Dengan angka ini usaha tidak pernah untung (laba maksimum ≤ 0). Turunkan biaya tetap atau naikkan harga maksimum.');
  if(c.F+c.dF<=0)e.push('Biaya tetap setelah perubahan harus tetap lebih dari 0.');
  if(c.v+c.dv<0)e.push('Biaya variabel setelah perubahan tidak boleh negatif.');
  if(!e.length&&m.disc2<=0)e.push('Setelah perubahan biaya, usaha tidak pernah untung. Kecilkan kenaikan biaya.');
  if(!e.length&&c.dF===0&&c.dv===0)e.push('Isi minimal satu perubahan biaya pada Lab koefisien.');
  if(!e.length){if(!isInt(m.q1)||!isInt(m.q2))w.push('Titik impas tidak bulat ('+f2(m.q1)+' dan '+f2(m.q2)+'), sehingga soal memakai jawaban desimal.');
    if(!isInt(m.t1)||!isInt(m.t2))w.push('Titik impas pada Lab koefisien tidak bulat.')}
  return{e,w}}
function normalize(o){const c={...DEFAULT,...o};['a0','b0','F','v','dF','dv'].forEach(k=>c[k]=+c[k]);
  ['judul','nama','profil','produk','satuan','labDesc','aiKonteks'].forEach(k=>c[k]=String(c[k]??'').slice(0,k==='aiKonteks'?300:120));return c}
const LOCALKEY='labaBatik.cfg';
try{const s=JSON.parse(localStorage.getItem(LOCALKEY)||'null');if(s){const c=normalize(s);if(!validate(c).e.length)C=c}}catch(e){}
let M=model(C);
const R=q=>C.a0*q-C.b0*q*q, Cost=q=>C.F+C.v*q, P=q=>R(q)-Cost(q), price=q=>C.a0-C.b0*q;
const T=q=>-C.b0*q*q+M.B2*q-M.F2;
const S=()=>(M.q2-M.q1)/6;                    // jarak antarbola
const pq=j=>M.q1-1.5*S()+j*S()/2;             // grid produksi (j = 0..18), puncak di j = 9
const coefStr=(a,b,c)=>`π(q) = −${f2(a)===f2(1)?'':f2(a)}q² + ${f2(b)}q − ${f2(c)}`;

/* ========== State ========== */
const KEY='labaBatik.v2';
function fresh(){return{s1:{R:true,C:true,A:true,ans:null},s2:{picked:new Set()},s3:{j:4,ok:false},s4:{a:C.b0,b:M.B,c:C.F,ok:false},s5:{cs:null,used:[]}}}
const st={step:0,done:[false,false,false,false,false,false,false],...fresh()};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.done)){st.done=s.done.slice(0,7);st.step=Math.min(6,s.step||0)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({done:st.done,step:st.step}))}catch(e){}}
const toastEl=$('#toast');let toastT;
function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),ms||4200)}
function fb(el,kind,html){el.className='fb show '+kind;el.innerHTML=html}

/* ========== Narasi ========== */

function kawungTexture(bg,fg,acc){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,256,256);
  for(let cx=0;cx<=256;cx+=128)for(let cy=0;cy<=256;cy+=128){
    for(let k=0;k<4;k++){g.save();g.translate(cx,cy);g.rotate(Math.PI/4+k*Math.PI/2);
      g.beginPath();g.ellipse(0,-34,22,34,0,0,Math.PI*2);g.fillStyle=fg;g.fill();
      g.beginPath();g.ellipse(0,-34,9,18,0,0,Math.PI*2);g.fillStyle=acc;g.fill();
      g.beginPath();g.arc(0,-34,3,0,Math.PI*2);g.fillStyle=fg;g.fill();g.restore();}
    g.beginPath();g.arc(cx,cy,7,0,Math.PI*2);g.fillStyle=acc;g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

const orb={theta:.55,phi:1.12,r:17,ty:.6,auto:false};
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function placeCam(){const s=Math.sin(orb.phi);camera.position.set(orb.r*s*Math.sin(orb.theta),orb.ty+orb.r*Math.cos(orb.phi),orb.r*s*Math.cos(orb.theta));camera.lookAt(0,orb.ty,0)}
const ptrs=new Map();let downPos=null,moved=0,pinch0=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});downPos=1;moved=0;orb.auto=false;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)orb.r=Math.max(7,Math.min(32,orb.r*pinch0/d));pinch0=d;return}
  orb.theta-=dx*.008;orb.phi=Math.max(.25,Math.min(1.85,orb.phi-dy*.006))});
cv.addEventListener('pointerup',e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(!ptrs.size&&moved<7&&downPos)pick(e)});
cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();orb.r=Math.max(7,Math.min(32,orb.r*(1+e.deltaY*.001)))},{passive:false});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let onPick=null;
function pick(e){if(!pickables.length)return;const r=cv.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pickables)[0];if(hit&&onPick)onPick(hit.object)}

  labels.forEach(L=>{tmp.copy(L.pos).project(camera);if(tmp.z>1){L.el.style.display='none';return}L.el.style.display='';

function s2(){

  <div class="eq">π(q) = R(q) − C(q) = ${coefStr(C.b0,M.B,C.F).slice(7)}</div>
  <p>Lantai motif kawung adalah garis <strong>π = 0</strong>. Bagian kurva di atas lantai berarti untung, di bawah lantai berarti rugi. Titik yang tepat berada di lantai disebut <strong>titik impas (BEP)</strong>.</p>${INFOHINT}
  <details class="concept"><summary>Apa itu titik impas (BEP)?</summary>
  <p><b>Definisi.</b> Titik impas (break-even point) adalah jumlah produksi ketika pendapatan sama dengan biaya total, sehingga laba nol: R(q) = C(q) atau π(q) = 0.</p>
  <p><b>Mengapa bisa dua?</b> Pada fungsi laba linear hanya ada satu BEP. Pada fungsi laba kuadrat bisa ada dua, karena harga turun saat produksi bertambah. BEP₁ menandai kapan usaha mulai untung, sedangkan BEP₂ menandai kapan usaha kembali rugi.</p>
  <p><b>Cara mencari.</b> Samakan π(q) dengan nol, lalu selesaikan dengan pemfaktoran atau rumus abc: q = [−b ± √(b² − 4ac)] ÷ 2a. Diskriminan b² − 4ac harus positif agar ada dua BEP.</p>
  <p><b>Di grafik 3D.</b> BEP adalah titik tempat kurva laba menembus lantai kawung. Di antara kedua BEP terdapat zona untung; di luar keduanya zona rugi.</p>
  <p><b>Makna bisnis.</b> BEP membantu pelaku usaha menentukan target produksi minimal, dan bagi analis kredit menunjukkan seberapa jauh usaha aman dari kerugian.</p></details>
  <div class="task"><h3>Sentuh dua bola yang merupakan titik impas</h3><p class="meta" id="picked">Belum ada bola yang dipilih.</p>
  <div class="row"><button class="btn primary" id="chk2" type="button">Periksa pilihan</button><button class="btn" id="hint2" type="button">Lihat petunjuk aljabar</button><button class="btn" id="rst2" type="button">Hapus pilihan</button></div>
  <div class="fb" id="fb2"></div></div>${navHTML()}`;

  const balls=[];for(let k=-1;k<=7;k++){const q=M.q1+k*S();const b=addSphere(q,P(q),0x9FD3FF,{k,q});balls.push(b);pickables.push(b)}
  const paint=()=>{balls.forEach(b=>{b.userData.sel=st.s2.picked.has(b.userData.k);const c=b.userData.sel?0xF3CF85:0x9FD3FF;b.material.color.set(c);b.material.emissive.set(c)});
    const arr=[...st.s2.picked].sort((a,b)=>a-b).map(k=>M.q1+k*S());$('#picked').textContent=arr.length?'Dipilih: '+arr.map(q=>'q = '+f2(q)+' (π = '+shortRp(P(q))+')').join(', '):'Belum ada bola yang dipilih.'};
  onPick=o=>{const k=o.userData.k;if(st.s2.picked.has(k))st.s2.picked.delete(k);else{if(st.s2.picked.size>=2){toast('Pilih maksimal dua bola. Sentuh bola terpilih untuk membatalkannya.');return}st.s2.picked.add(k)}paint()};
  paint();hud([['Laba π(q)','#E2B260'],['Bola calon BEP','#9FD3FF'],['ⓘ Titik penjelasan','#9FE8FF']]);
  const f=$('#fb2');let shown=false;
  $('#rst2').onclick=()=>{st.s2.picked.clear();paint();f.className='fb'};
  $('#hint2').onclick=()=>fb(f,'info',`Samakan laba dengan nol: −${f2(C.b0)}q² + ${f2(M.B)}q − ${f2(C.F)} = 0. Bagi kedua ruas dengan −${f2(C.b0)} sehingga q² − ${f2(M.B/C.b0)}q + ${f2(C.F/C.b0)} = 0. Cari dua bilangan yang hasil kalinya ${f2(C.F/C.b0)} dan jumlahnya ${f2(M.B/C.b0)}, atau gunakan rumus abc.`);
  const ok=()=>{fb(f,'ok',`<strong>Benar, BEP ada di ${f2(M.q1)} dan ${f2(M.q2)} ${esc(C.satuan)}.</strong> Berikut penyelesaian lengkapnya:${bepCalc()}Pemeriksaan: pada q = ${f2(M.q1)}, R = ${rp(R(M.q1))} dan C = ${rp(Cost(M.q1))}; pada q = ${f2(M.q2)}, R = ${rp(R(M.q2))} dan C = ${rp(Cost(M.q2))}. Karena R = C, laba di kedua titik nol. Artinya ${esc(C.nama)} untung jika memproduksi di antara ${f2(M.q1)} dan ${f2(M.q2)} ${esc(C.satuan)}. Sentuh label ⓘ di kedua titik untuk penjelasan lengkap.`);
    if(!shown){const b1=INFO.bep1(),b2=INFO.bep2();infoPoint(M.q1,0,'BEP '+f2(M.q1),b1[0],b1[1]);infoPoint(M.q2,0,'BEP '+f2(M.q2),b2[0],b2[1]);shown=true}markDone(2)};
  $('#chk2').onclick=()=>{const a=[...st.s2.picked].sort((x,y)=>x-y);

  <div class="slider"><div class="top"><span>a (kelengkungan)</span><span id="va"></span></div><input type="range" id="sa" min="${aMin}" max="${aMax}" step="${stepA}" value="${s.a}" aria-label="Koefisien a"></div>
  <div class="slider"><div class="top"><span>b (pengaruh tiap ${esc(C.satuan)})</span><span id="vb"></span></div><input type="range" id="sb" min="${bMin}" max="${bMax}" step="${stepB}" value="${s.b}" aria-label="Koefisien b"></div>
  <div class="slider"><div class="top"><span>c (biaya tetap)</span><span id="vc"></span></div><input type="range" id="sc4" min="${cMin}" max="${cMax}" step="${stepC}" value="${s.c}" aria-label="Koefisien c"></div>
  <div class="row"><button class="btn primary" id="chk4" type="button">Periksa fungsi baru</button><button class="btn" id="hint4" type="button">Petunjuk</button></div><div class="fb" id="fb4"></div></div>${navHTML()}`;
  const s_=S();viewProfit(Math.min(M.t1,M.q1)-1.2*s_,Math.max(M.t2,M.q2)+1.2*s_);V.ys=4/Math.max(M.pmax,M.tmax);
  addCurve(T,0xffffff,{r:.14,opacity:.3,glow:.6});addLabel('Target: laba setelah perubahan',new THREE.Vector3(X(M.ts),Y(M.tmax)+1.1,0),'');
  addAxes(ticks(V.qMin,V.qMax),[Math.round(Math.min(P(V.qMin),T(V.qMin),T(V.qMax))/100)*100,0,Math.max(M.pmax,M.tmax)]);
  const fn=()=>q=>-s.a*q*q+s.b*q-s.c;
  const upd=()=>{if(s4curve){world.remove(s4curve);disposeObj(s4curve)}s4curve=addCurve(fn(),0xE2B260,{r:.08});
    $('#va').textContent='−'+f2(s.a);$('#vb').textContent=f2(s.b);$('#vc').textContent=f2(s.c);$('#eq4').textContent=coefStr(s.a,s.b,s.c)};
  s4curve=null;upd();
  $('#sa').oninput=e=>{s.a=+e.target.value;upd()};$('#sb').oninput=e=>{s.b=+e.target.value;upd()};$('#sc4').oninput=e=>{s.c=+e.target.value;upd()};
  hud([['Fungsimu','#E2B260'],['Target','#ffffff']]);
  const f=$('#fb4'),eq=(x,y)=>Math.abs(x-y)<1e-6;let shown=false;
  $('#hint4').onclick=()=>fb(f,'info',`Harga jual tetap, jadi koefisien q² (a) tidak berubah. Koefisien b = harga maksimum − biaya per ${esc(C.satuan)} = ${f2(C.a0)} − (${f2(C.v)} ${C.dv>=0?'+':'−'} ${f2(Math.abs(C.dv))}). Koefisien c = biaya tetap = ${f2(C.F)} ${C.dF>=0?'+':'−'} ${f2(Math.abs(C.dF))}.`);
  const ok=()=>{const moved=!eq(M.ts,M.qs);
    fb(f,'ok',`<strong>Fungsi baru: ${coefStr(C.b0,M.B2,M.F2)}.</strong> Puncaknya ${moved?'pindah ke':'tetap di'} q* = <strong>${f2(M.ts)} ${esc(C.satuan)}</strong> dengan laba maksimum ${rp(M.tmax)} (sebelumnya ${rp(M.pmax)}), dan BEP bergeser ke ${f2(M.t1)} dan ${f2(M.t2)}. Pelajaran bisnisnya: biaya per unit (b) menggeser jumlah produksi optimal, sedangkan biaya tetap (c) hanya menaikkan atau menurunkan seluruh kurva tanpa mengubah letak puncaknya.`);
    if(!shown){const cP=['Titik puncak baru',`<p>Setelah perubahan, laba maksimum ${rp(M.tmax)} dicapai pada q* = ${f2(M.ts)} ${esc(C.satuan)}.</p><p>${moved?`Puncak bergeser ${M.ts<M.qs?'ke kiri':'ke kanan'} sejauh ${f2(Math.abs(M.ts-M.qs))} karena biaya per ${esc(C.satuan)} berubah sehingga b berubah.`:'Letak puncak tidak berubah karena biaya per unit tetap; yang berubah hanya tinggi kurva.'}</p>`];
      const b1=['Titik impas baru (BEP₁)',`<p>Dengan biaya baru, ${esc(C.nama)} mulai untung setelah memproduksi ${f2(M.t1)} ${esc(C.satuan)} (sebelumnya ${f2(M.q1)}).</p>`];
      const b2=['Titik impas baru (BEP₂)',`<p>Batas atas produksi yang masih menguntungkan menjadi ${f2(M.t2)} ${esc(C.satuan)} (sebelumnya ${f2(M.q2)}).</p>`];
      infoPoint(M.ts,M.tmax,'Puncak baru',cP[0],cP[1],0xF3CF85);infoPoint(M.t1,0,'BEP '+f2(M.t1),b1[0],b1[1]);infoPoint(M.t2,0,'BEP '+f2(M.t2),b2[0],b2[1]);shown=true}
    s.ok=true;markDone(4)};
  $('#chk4').onclick=()=>{const tips=[];
    if(!eq(s.a,C.b0))tips.push(`a sebaiknya ${s.a>C.b0?'diperkecil':'diperbesar'} (harga jual tidak berubah)`);
    if(!eq(s.b,M.B2))tips.push(`b ${s.b>M.B2?'terlalu besar':'terlalu kecil'}`);
    if(!eq(s.c,M.F2))tips.push(`c ${s.c>M.F2?'terlalu besar':'terlalu kecil'}`);
    if(!tips.length)ok();else fb(f,'bad','Belum menempel: '+tips.join('; ')+'.')};
  if(st.done[4]){Object.assign(s,{a:C.b0,b:M.B2,c:M.F2});['sa','sb','sc4'].forEach((id,i)=>$('#'+id).value=[s.a,s.b,s.c][i]);upd();ok()}
}
/* --- 5 --- */
function drawCase(cs,reveal){clearWorld();
  const lo=Math.max(0,cs.h-1.4*cs.d),hi=cs.h+1.4*cs.d;V={qMin:lo,qMax:hi,ys:4/(cs.a*cs.d*cs.d)};
  const f=q=>-cs.a*q*q+cs.b*q-cs.c;addCurve(f,0xE2B260,{r:.09});
  addAxes(ticks(lo,hi),[f(lo)<0?Math.round(f(lo)/100)*100:0,0,cs.a*cs.d*cs.d]);
  if(reveal){
    infoPoint(cs.h,cs.a*cs.d*cs.d,'Puncak q = '+cs.h,'Titik puncak laba',`<p>Laba maksimum ${rp(cs.a*cs.d*cs.d)} dicapai saat ${esc(cs.tokoh)} memproduksi ${cs.h} ${esc(cs.satuan)}.</p><p class="ifx">q* = −b ÷ 2a = ${fmt(cs.b)} ÷ ${2*cs.a} = ${cs.h}</p>`,0xF3CF85);
    infoPoint(cs.h-cs.d,0,'BEP '+(cs.h-cs.d),'Titik impas pertama',`<p>Di bawah ${cs.h-cs.d} ${esc(cs.satuan)}, penjualan belum menutup biaya tetap ${rp(cs.c)}.</p>`);
    infoPoint(cs.h+cs.d,0,'BEP '+(cs.h+cs.d),'Titik impas kedua',`<p>Di atas ${cs.h+cs.d} ${esc(cs.satuan)}, ${esc(cs.tokoh)} kembali rugi karena harga harus turun terlalu jauh.</p>`)}
  hud([['Laba π(q) kasus '+cs.produk,'#E2B260']])}
function s5(){
  narrText='Latihan dengan kecerdasan buatan generatif. Tekan tombol buat kasus baru, dan GenAI akan menyusun cerita usaha dari daerah lain di Indonesia. Aplikasi memeriksa setiap angka agar tetap akurat secara matematis. Hitung produksi optimal, laba maksimum, dan kedua titik impas, lalu minta umpan balik dari GenAI.';
  if(!st.s5.cs){st.s5.cs=localCase();st.s5.used.push(st.s5.cs.produk)}
  const cs=st.s5.cs,aiOK=!!sampleFn;
  $('#content').innerHTML=`<h2>Kasus baru dari penjuru Nusantara</h2><p class="meta">Tahap 6 dari 7 · sekitar 4 menit</p>
  <p>GenAI menyusun kasus usaha lokal yang baru setiap kali kamu meminta. Aplikasi lalu memeriksa angkanya agar fungsi laba selalu valid dan punya jawaban bulat.</p>
  <div class="row"><button class="btn primary" id="gen" type="button" ${aiOK?'':'disabled'}>✨ Buat kasus baru dengan GenAI</button><button class="btn" id="genL" type="button">Ambil dari bank kasus</button></div>
  ${aiOK?'':'<p class="meta" style="margin-top:8px">GenAI tidak tersedia di tampilan ini (misalnya saat aplikasi dibuka di luar claude.ai). Latihan tetap berjalan dengan bank kasus bawaan.</p>'}
  <div class="task"><p><span class="badge ${cs.src==='ai'?'ai':''}">${cs.src==='ai'?'Dibuat GenAI':'Bank kasus'}</span> <strong>${esc(cs.produk)}</strong> · ${esc(cs.daerah)}</p>
  <p>${esc(cs.cerita)}</p><div class="eq">π(q) = −${cs.a===1?'':cs.a}q² + ${fmt(cs.b)}q − ${fmt(cs.c)}</div>
  <p class="meta">q = jumlah ${esc(cs.satuan)} per bulan, π dalam ribu rupiah. Titik ⓘ di grafik muncul setelah jawabanmu benar.</p>
  <div class="form"><label>Produksi optimal q*<input id="i1" inputmode="numeric"></label><label>Laba maksimum (ribu Rp)<input id="i2" inputmode="numeric"></label>
  <label>BEP terkecil<input id="i3" inputmode="numeric"></label><label>BEP terbesar<input id="i4" inputmode="numeric"></label></div>
  <label style="display:block;margin-top:10px;font-size:13px;font-weight:600">Jelaskan langkahmu (opsional, dibaca GenAI)<textarea id="why"></textarea></label>
  <div class="row"><button class="btn primary" id="chk5" type="button">Periksa jawaban</button><button class="btn" id="fbai" type="button" ${aiOK?'':'disabled'}>Minta umpan balik GenAI</button></div>
  <div class="fb" id="fb5"></div><div class="fb info" id="fbA"></div>${cs.tanya?`<p style="margin-top:12px"><strong>Refleksi:</strong> ${esc(cs.tanya)}</p>`:''}</div>${navHTML()}`;
  drawCase(cs,false);
  $('#gen').onclick=async()=>{const b=$('#gen');b.disabled=true;$('#genL').disabled=true;b.textContent='Menyusun kasus…';
    try{const c=await aiCase();st.s5.cs=c;st.s5.used.push(c.produk);s5();bindNav()}
    catch(e){toast(errCopy[e&&e.code]||'GenAI gagal menyusun kasus. Coba lagi atau ambil dari bank kasus.');if(e&&e.code==='not_granted')sampleFn=null;s5();bindNav()}};
  $('#genL').onclick=()=>{st.s5.cs=localCase();st.s5.used.push(st.s5.cs.produk);s5();bindNav()};
  const vals=()=>['i1','i2','i3','i4'].map(id=>num($('#'+id).value));
  const key=[cs.h,cs.a*cs.d*cs.d,cs.h-cs.d,cs.h+cs.d],f=$('#fb5');
  $('#chk5').onclick=()=>{const v=vals(),nm=['Produksi optimal','Laba maksimum','BEP terkecil','BEP terbesar'],ok=v.map((x,i)=>x===key[i]);
    if(ok.every(Boolean)){fb(f,'ok',`<strong>Semua benar.</strong> q* = −b/2a = ${fmt(cs.b)}/${2*cs.a} = ${cs.h}, laba maksimum π(${cs.h}) = ${rp(key[1])}, dan BEP di ${key[2]} serta ${key[3]} ${esc(cs.satuan)}. Sentuh label ⓘ di grafik untuk penjelasan setiap titik.`);drawCase(cs,true);markDone(5)}
    else fb(f,'bad',nm.map((n,i)=>`${ok[i]?'✓':'✗'} ${n}`).join('<br>')+'<br>Petunjuk: mulai dari q* = −b / 2a, lalu substitusikan ke π(q). Untuk BEP, selesaikan π(q) = 0 dengan memfaktorkan atau rumus abc.')};
  const fa=$('#fbA');fa.style.display='none';
  $('#fbai').onclick=async()=>{if(!sampleFn)return;const v=vals();fa.style.display='block';fa.textContent='GenAI sedang membaca jawabanmu…';$('#fbai').disabled=true;
    const prompt=`Kamu tutor Matematika Bisnis yang hangat untuk mahasiswa Indonesia. Kasus: ${cs.tokoh}, usaha ${cs.produk} di ${cs.daerah}. Fungsi laba π(q) = −${cs.a}q² + ${cs.b}q − ${cs.c} (ribu rupiah, q dalam ${cs.satuan}).
Kunci (JANGAN langsung sebutkan angka kunci yang dijawab salah): q* = ${key[0]}, laba maksimum = ${key[1]}, BEP = ${key[2]} dan ${key[3]}.
Jawaban mahasiswa: q* = ${v[0]}, laba maks = ${v[1]}, BEP = ${v[2]} dan ${v[3]}. Penjelasan mahasiswa: "${($('#why').value||'(tidak ada)').slice(0,600)}".
Beri umpan balik dalam bahasa Indonesia, maks 110 kata, teks biasa tanpa markdown: sebut yang sudah benar, untuk yang salah tunjukkan letak kekeliruan langkahnya dan beri satu pertanyaan penuntun, lalu tutup dengan satu kalimat makna hasil itu bagi keputusan bisnis ${cs.tokoh}.`;
    try{await sampleFn(prompt,{modelTier:'quick',cache:false,onText:({text})=>{fa.textContent=text}})}
    catch(e){fa.textContent=(e&&e.text)||errCopy[e&&e.code]||'Umpan balik GenAI belum bisa dimuat. Gunakan tombol Periksa jawaban.'}
    finally{$('#fbai').disabled=!sampleFn}};
}
/* --- 6 --- */
function s6(){
  narrText='Rangkuman. Fungsi laba berbentuk parabola terbuka ke bawah. Titik impas adalah akar fungsi laba. Produksi optimal ada di puncak parabola, yaitu negatif b per dua a, tepat di tengah kedua titik impas. Biaya per unit menggeser titik optimal, sedangkan biaya tetap menggeser kurva naik atau turun.';
  const n=st.done.slice(0,6).filter(Boolean).length,order=Math.round(M.q2+S());
  $('#content').innerHTML=`<h2>Apa yang dipelajari dari usaha ${esc(C.nama)}</h2><p class="meta">Tahap 7 dari 7 · kamu menyelesaikan ${n} dari 6 tahap</p>
  <ul class="clean"><li>Pendapatan R = p · q menjadi kuadrat karena harga turun saat jumlah naik.</li><li>Laba π(q) = R − C adalah parabola terbuka ke bawah (a negatif).</li>
  <li>Titik impas adalah akar π(q) = 0: untuk ${esc(C.nama)}, ${f2(M.q1)} dan ${f2(M.q2)} ${esc(C.satuan)}.</li>
  <li>Produksi optimal ada di puncak, q* = −b/2a = ${f2(M.qs)} ${esc(C.satuan)}, tepat di tengah kedua BEP.</li>
  <li>Biaya per unit (b) menggeser titik optimal; biaya tetap (c) hanya menaikkan atau menurunkan kurva.</li></ul>${INFOHINT}
  <div class="task"><h3>Refleksi</h3><p>${esc(C.nama)} mendapat pesanan ${order} ${esc(C.satuan)} dengan harga sesuai fungsi permintaan. Berdasarkan grafik, apakah sebaiknya ia menerima semua pesanan itu? Apa yang harus berubah agar ${order} ${esc(C.satuan)} tetap menguntungkan?</p></div>
  <div class="row">${STEPS.slice(0,6).map((s,i)=>`<span class="badge">${st.done[i]?'✓':'○'} ${s.t}</span>`).join('')}</div>
  <div class="row"><button class="btn" id="reset" type="button">Ulangi dari awal</button></div>${navHTML()}`;
  viewProfit(undefined);V.qMax=Math.max(V.qMax,order+S()*0.5);orb.auto=true;
  addCurve(P,0xE2B260,{r:.09});profitAxes();zoneLabels();revealProfitPoints();
  banner(order,P);infoPoint(order,P(order),'Pesanan '+order,'Pesanan besar',`<p>Jika memproduksi ${order} ${esc(C.satuan)}, harga harus turun ke ${rp(price(order))} sehingga laba menjadi <b>${rp(P(order))}</b>.</p><p>Titik ini berada di zona rugi karena melewati BEP₂ (${f2(M.q2)}). Pesanan bisa diterima jika harga dinegosiasikan lebih tinggi atau biaya per ${esc(C.satuan)} ditekan.</p>`,0xFFB4A1);
  hud([['Laba π(q)','#E2B260'],['ⓘ Titik penjelasan','#9FE8FF']]);
  $('#reset').onclick=()=>{st.done=st.done.map(()=>false);Object.assign(st,fresh());go(0)};
}

/* ========== Mode Dosen ========== */
const dlg=$('#dosen'),FIELDS_T=['judul','nama','profil','produk','satuan','labDesc','aiKonteks'],FIELDS_N=['a0','b0','F','v','dF','dv'];
function fillForm(c){const f=dlg.querySelector('form');FIELDS_T.forEach(k=>f.elements[k].value=c[k]);FIELDS_N.forEach(k=>f.elements[k].value=String(c[k]).replace('.',','))}
function readForm(){const f=dlg.querySelector('form'),o={};FIELDS_T.forEach(k=>o[k]=f.elements[k].value.trim());FIELDS_N.forEach(k=>o[k]=num(f.elements[k].value));return normalize(o)}
function preview(){const c=readForm(),{e,w}=validate(c),box=$('#dPrev');
  if(e.length){box.className='fb show bad';box.innerHTML=e.map(esc).join('<br>');return null}
  const m=model(c);
  box.className='fb show info';box.innerHTML=`<strong>Kunci jawaban otomatis</strong><br>
  Fungsi laba: −${f2(c.b0)}q² + ${f2(m.B)}q − ${f2(c.F)}<br>
  Tahap 2: rentang untung ${f2(m.q1)} sampai ${f2(m.q2)} ${esc(c.satuan)}<br>
  Tahap 3: BEP = ${f2(m.q1)} dan ${f2(m.q2)}<br>
  Tahap 4: q* = ${f2(m.qs)}, harga ${rp(c.a0-c.b0*m.qs)}, laba maksimum ${rp(m.pmax)}<br>
  Tahap 5: fungsi baru −${f2(c.b0)}q² + ${f2(m.B2)}q − ${f2(m.F2)}, puncak ${f2(m.ts)}, BEP ${f2(m.t1)} dan ${f2(m.t2)}`+
  (w.length?`<br><br><strong>Catatan:</strong> ${w.map(esc).join(' ')}`:'');return c}
$('#btnDosen').onclick=()=>{fillForm(C);preview();
  $('#dMode').textContent=db&&canEditCfg?'Pengaturan disimpan untuk semua mahasiswa yang membuka tautan aplikasi ini.':'Database bersama tidak tersedia di tampilan ini, jadi pengaturan hanya berlaku di perangkat ini. Untuk membagikan ke mahasiswa, buka aplikasi dari claude.ai sebagai pemilik.';
  dlg.showModal()};
dlg.querySelector('form').addEventListener('input',preview);
$('#dCancel').onclick=()=>dlg.close();
$('#dReset').onclick=()=>{fillForm(DEFAULT);preview()};
$('#dSave').onclick=async e=>{e.preventDefault();const c=preview();if(!c){toast('Periksa kembali isian yang ditandai.');return}
  setConfig(c);try{localStorage.setItem(LOCALKEY,JSON.stringify(c))}catch(err){}
  if(db&&canEditCfg){try{await db.doc('config/main').set({...c});toast('Soal diperbarui untuk semua mahasiswa.')}catch(err){toast('Soal diperbarui di perangkat ini, tetapi gagal dibagikan. Periksa koneksi lalu simpan lagi.',6500)}}
  else toast('Soal diperbarui di perangkat ini.');
  st.done=st.done.map(()=>false);save();dlg.close();go(0)};

render();
})();
</script>
</body>
